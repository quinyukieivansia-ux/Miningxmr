---
# ============================================================
# run-command.yml - Jalankan command apapun ke semua worker
# Pakai:
#   ansible-playbook playbooks/run-command.yml -e "cmd='uptime'"
#   ansible-playbook playbooks/run-command.yml -e "cmd='apt update && apt -y upgrade'"
# Targetkan satu host saja:
#   ansible-playbook playbooks/run-command.yml -e "cmd='df -h'" --limit vps1
# ============================================================
- name: Jalankan command di fleet
  hosts: workers
  gather_facts: no
  tasks:
    - name: Pastikan variabel cmd diisi
      fail:
        msg: "Wajib isi -e \"cmd='perintah kamu'\""
      when: cmd is not defined

    - name: Eksekusi command
      shell: "{{ cmd }}"
      register: result
      changed_when: false
      ignore_errors: yes

    - name: Tampilkan output
      debug:
        msg: |
          === {{ inventory_hostname }} (rc={{ result.rc }}) ===
          {{ result.stdout if result.stdout else '(tidak ada stdout)' }}
          {{ ('STDERR: ' + result.stderr) if result.stderr else '' }}
