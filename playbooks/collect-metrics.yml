---
# ============================================================
# collect-metrics.yml - Kumpulkan metrik semua VPS ke JSON
# Dipanggil otomatis oleh dashboard / cron.
# Output: /root/fleet/dashboard/data/metrics.json
# ============================================================
- name: Kumpulkan metrik fleet
  hosts: workers
  gather_facts: yes
  ignore_unreachable: yes
  tasks:
    - name: Disk root (persen + detail)
      shell: df -h / | awk 'NR==2 {print $5"|"$3"|"$2}'
      register: disk
      changed_when: false

    - name: RAM (MB terpakai|total|persen)
      shell: free -m | awk 'NR==2 {printf "%d|%d|%d", $3, $2, $3/$2*100}'
      register: ram
      changed_when: false

    - name: Load average 1/5/15 menit
      shell: cat /proc/loadavg | awk '{print $1"|"$2"|"$3}'
      register: load
      changed_when: false

    - name: Uptime detik
      shell: cat /proc/uptime | awk '{print int($1)}'
      register: uptime_sec
      changed_when: false

    - name: Set fakta per host
      set_fact:
        host_metric:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          online: true
          vcpus: "{{ ansible_processor_vcpus | default(0) }}"
          disk_pct: "{{ disk.stdout.split('|')[0] | default('?') }}"
          disk_used: "{{ disk.stdout.split('|')[1] | default('?') }}"
          disk_total: "{{ disk.stdout.split('|')[2] | default('?') }}"
          ram_used: "{{ ram.stdout.split('|')[0] | default('0') }}"
          ram_total: "{{ ram.stdout.split('|')[1] | default('0') }}"
          ram_pct: "{{ ram.stdout.split('|')[2] | default('0') }}"
          load1: "{{ load.stdout.split('|')[0] | default('?') }}"
          load5: "{{ load.stdout.split('|')[1] | default('?') }}"
          load15: "{{ load.stdout.split('|')[2] | default('?') }}"
          uptime_sec: "{{ uptime_sec.stdout | default('0') }}"

- name: Tulis JSON gabungan
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Susun data semua host
      set_fact:
        all_metrics: >-
          {{ groups['workers'] | map('extract', hostvars)
             | selectattr('host_metric', 'defined')
             | map(attribute='host_metric') | list }}

    - name: Pastikan folder data ada
      file:
        path: /root/fleet/dashboard/data
        state: directory

    - name: Tulis metrics.json
      copy:
        content: "{{ {'updated': ansible_date_time.iso8601 | default(now), 'hosts': all_metrics} | to_nice_json }}"
        dest: /root/fleet/dashboard/data/metrics.json
