---
# ============================================================
# health.yml - Cek kesehatan semua VPS worker sekaligus
# Pakai: ansible-playbook playbooks/health.yml
# ============================================================
- name: Cek kesehatan fleet
  hosts: workers
  gather_facts: yes
  tasks:
    - name: Ambil uptime
      command: uptime -p
      register: uptime_out
      changed_when: false

    - name: Ambil penggunaan disk (root)
      shell: df -h / | awk 'NR==2 {print $5 " terpakai (" $3 "/" $2 ")"}'
      register: disk_out
      changed_when: false

    - name: Ambil penggunaan RAM
      shell: free -m | awk 'NR==2 {printf "%d/%d MB (%.0f%%)", $3, $2, $3/$2*100}'
      register: ram_out
      changed_when: false

    - name: Ambil load average
      shell: cat /proc/loadavg | awk '{print $1, $2, $3}'
      register: load_out
      changed_when: false

    - name: Tampilkan ringkasan
      debug:
        msg: >-
          [{{ inventory_hostname }}]
          CPU={{ ansible_processor_vcpus | default('?') }}vcpu |
          RAM={{ ram_out.stdout }} |
          DISK={{ disk_out.stdout }} |
          LOAD={{ load_out.stdout }} |
          {{ uptime_out.stdout }}
