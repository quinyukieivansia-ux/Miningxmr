---
# ============================================================
# deploy-script.yml - Kirim script lokal ke semua worker & jalankan
# Pakai:
#   ansible-playbook playbooks/deploy-script.yml -e "src=scripts/setup.sh"
#   ansible-playbook playbooks/deploy-script.yml -e "src=scripts/setup.sh run=no"  # kirim saja, tidak dijalankan
# Script lokal taruh di folder /root/fleet/scripts/
# ============================================================
- name: Deploy & jalankan script di fleet
  hosts: workers
  gather_facts: no
  vars:
    run: "yes"
    dest_dir: "/opt/fleet-scripts"
  tasks:
    - name: Pastikan variabel src diisi
      fail:
        msg: "Wajib isi -e \"src=scripts/namafile.sh\""
      when: src is not defined

    - name: Buat folder tujuan di worker
      file:
        path: "{{ dest_dir }}"
        state: directory
        mode: "0755"

    - name: Salin script ke worker
      copy:
        src: "{{ src }}"
        dest: "{{ dest_dir }}/{{ src | basename }}"
        mode: "0755"

    - name: Jalankan script
      command: "{{ dest_dir }}/{{ src | basename }}"
      register: script_out
      when: run | bool
      changed_when: false
      ignore_errors: yes

    - name: Tampilkan hasil
      debug:
        msg: |
          === {{ inventory_hostname }} ===
          {{ script_out.stdout | default('(script dikirim, tidak dijalankan)') }}
      when: run | bool
