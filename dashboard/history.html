<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet History - Grafik Tren</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#0d1117; color:#e6edf3; padding:20px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  h1 { font-size:20px; font-weight:600; }
  a { color:#58a6ff; text-decoration:none; font-size:14px; }
  .controls { margin-bottom:16px; }
  select { background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:8px 12px; font-size:14px; }
  .chart-box { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; margin-bottom:16px; }
  .chart-box h3 { font-size:14px; margin-bottom:10px; color:#8b949e; font-weight:500; }
  canvas { max-height:260px; }
  .err { color:#f85149; text-align:center; padding:40px; }
</style>
</head>
<body>
<header>
  <h1>📈 Fleet History</h1>
  <a href="index.html">← kembali ke dashboard</a>
</header>
<div class="controls">
  <label style="font-size:14px; color:#8b949e;">Pilih VPS: </label>
  <select id="hostSel" onchange="render()"></select>
</div>
<div class="chart-box"><h3>RAM Usage (%)</h3><canvas id="ramChart"></canvas></div>
<div class="chart-box"><h3>Disk Usage (%)</h3><canvas id="diskChart"></canvas></div>
<div class="chart-box"><h3>Load Average (1 menit)</h3><canvas id="loadChart"></canvas></div>

<script>
let history = [];
let charts = {};

async function load(){
  try{
    const r = await fetch('data/history.jsonl?'+Date.now());
    if(!r.ok) throw new Error('history.jsonl belum ada');
    const text = await r.text();
    history = text.trim().split('\n').filter(l=>l).map(l=>JSON.parse(l));
    if(!history.length) throw new Error('history kosong');

    // Kumpulkan semua nama host
    const names = new Set();
    history.forEach(s=>Object.keys(s.hosts||{}).forEach(n=>names.add(n)));
    const sel = document.getElementById('hostSel');
    sel.innerHTML = [...names].map(n=>`<option value="${n}">${n}</option>`).join('');
    render();
  }catch(e){
    document.body.innerHTML += `<div class="err">⚠ ${e.message}<br><br>Tunggu cron jalan, atau jalankan:<br><code>./fleet collect && python3 fleet_history.py</code></div>`;
  }
}

function buildChart(id, label, color, labels, data){
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type:'line',
    data:{ labels, datasets:[{ label, data, borderColor:color, backgroundColor:color+'22', fill:true, tension:0.3, pointRadius:0, borderWidth:2 }] },
    options:{ responsive:true, plugins:{legend:{display:false}},
      scales:{ x:{ticks:{color:'#8b949e',maxTicksLimit:8},grid:{color:'#21262d'}},
               y:{ticks:{color:'#8b949e'},grid:{color:'#21262d'},beginAtZero:true} } }
  });
}

function render(){
  const host = document.getElementById('hostSel').value;
  const pts = history.filter(s=>s.hosts && s.hosts[host]);
  const labels = pts.map(s=>{ const d=new Date(s.t*1000); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); });
  buildChart('ramChart','RAM %','#3fb950', labels, pts.map(s=>s.hosts[host].ram));
  buildChart('diskChart','Disk %','#d29922', labels, pts.map(s=>s.hosts[host].disk));
  buildChart('loadChart','Load','#58a6ff', labels, pts.map(s=>s.hosts[host].load));
}

load();
setInterval(load, 60000); // refresh tiap 1 menit
</script>
</body>
</html>
