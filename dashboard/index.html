<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Monitor - 20 VPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#0d1117; color:#e6edf3; padding:20px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  h1 { font-size:20px; font-weight:600; }
  .updated { font-size:13px; color:#8b949e; }
  .summary { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:12px 18px; }
  .stat .num { font-size:22px; font-weight:700; }
  .stat .lbl { font-size:12px; color:#8b949e; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:14px; }
  .card.offline { border-color:#f85149; opacity:0.7; }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .card-name { font-weight:600; font-size:15px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.on { background:#3fb950; box-shadow:0 0 6px #3fb950; }
  .dot.off { background:#f85149; }
  .ip { font-size:12px; color:#8b949e; margin-bottom:10px; }
  .bar-row { margin:8px 0; }
  .bar-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .bar { height:6px; background:#21262d; border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:3px; transition:width 0.3s; }
  .ok { background:#3fb950; } .warn { background:#d29922; } .crit { background:#f85149; }
  .meta { font-size:12px; color:#8b949e; margin-top:8px; display:flex; justify-content:space-between; }
  .err { color:#f85149; text-align:center; padding:40px; }
</style>
</head>
<body>
<header>
  <h1>🖥️ Fleet Monitor</h1>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="history.html" style="color:#58a6ff;text-decoration:none;font-size:14px">📈 Grafik History</a>
    <span class="updated" id="updated">memuat...</span>
  </div>
</header>
<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>

<script>
function barClass(pct){ pct=parseFloat(pct)||0; return pct<60?'ok':pct<85?'warn':'crit'; }
function fmtUptime(sec){
  sec=parseInt(sec)||0; const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600);
  return d>0?`${d}h ${h}j`:`${h}j`;
}
async function load(){
  try{
    const r = await fetch('data/metrics.json?'+Date.now());
    if(!r.ok) throw new Error('metrics.json belum ada');
    const data = await r.json();
    const hosts = data.hosts||[];
    document.getElementById('updated').textContent = 'Update: '+(data.updated||'-');

    const online = hosts.filter(h=>h.online).length;
    const avgCpu = hosts.length? (hosts.reduce((s,h)=>s+(parseFloat(h.load1)||0),0)/hosts.length).toFixed(2):0;
    const avgRam = hosts.length? Math.round(hosts.reduce((s,h)=>s+(parseFloat(h.ram_pct)||0),0)/hosts.length):0;
    document.getElementById('summary').innerHTML = `
      <div class="stat"><div class="num">${hosts.length}</div><div class="lbl">Total VPS</div></div>
      <div class="stat"><div class="num" style="color:#3fb950">${online}</div><div class="lbl">Online</div></div>
      <div class="stat"><div class="num" style="color:#f85149">${hosts.length-online}</div><div class="lbl">Offline</div></div>
      <div class="stat"><div class="num">${avgRam}%</div><div class="lbl">Avg RAM</div></div>
      <div class="stat"><div class="num">${avgCpu}</div><div class="lbl">Avg Load</div></div>`;

    document.getElementById('grid').innerHTML = hosts.map(h=>{
      if(!h.online) return `<div class="card offline"><div class="card-head"><span class="card-name">${h.name}</span><span class="dot off"></span></div><div class="ip">${h.ip}</div><div class="err" style="padding:10px">⚠ OFFLINE / unreachable</div></div>`;
      const ramPct=parseFloat(h.ram_pct)||0, diskPct=parseFloat(h.disk_pct)||0;
      return `<div class="card">
        <div class="card-head"><span class="card-name">${h.name}</span><span class="dot on"></span></div>
        <div class="ip">${h.ip} · ${h.vcpus} vCPU</div>
        <div class="bar-row"><div class="bar-label"><span>RAM</span><span>${h.ram_used}/${h.ram_total} MB (${ramPct}%)</span></div>
          <div class="bar"><div class="bar-fill ${barClass(ramPct)}" style="width:${ramPct}%"></div></div></div>
        <div class="bar-row"><div class="bar-label"><span>Disk</span><span>${h.disk_used}/${h.disk_total} (${diskPct}%)</span></div>
          <div class="bar"><div class="bar-fill ${barClass(diskPct)}" style="width:${diskPct}%"></div></div></div>
        <div class="meta"><span>Load: ${h.load1} / ${h.load5} / ${h.load15}</span><span>up ${fmtUptime(h.uptime_sec)}</span></div>
      </div>`;
    }).join('') || '<div class="err">Belum ada VPS terdaftar. Tambahkan di inventory.ini lalu jalankan collect.</div>';
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="err">⚠ ${e.message}<br><br>Jalankan dulu: <code>./fleet collect</code></div>`;
  }
}
load();
setInterval(load, 15000); // auto-refresh tiap 15 detik
</script>
</body>
</html>
